# Curated program → entity labels, seeded into the entities table.
# DeFiLlama mappings and operator naming do the rest. slugs must be unique, and
# no program id may appear under two entities — findEntityForProgram takes the
# first row that matches, so a duplicate makes naming order-dependent.
#
# WHY A REGISTRY AT ALL
#   The index is built from loader events and names are recovered from the
#   binary, which works: Rust panic paths and security.txt de-opaque about half
#   of anonymous programs. What it recovers is the CRATE name, though — `vaults`,
#   `liquidity`, `order-engine`, `amm`. Those are honest and, for a well-known
#   protocol, useless: two unrelated programs both came back `amm`. A registry
#   name outranks every other naming source (pipeline.ts), so an id listed here
#   is how a landmark gets called what people call it.
#
# TWO FORMS UNDER programIds
#   - <id>                 the program carries the entity name. Right when the
#                          entity is one program.
#   - <id>: <name>         the program carries its own name. Jupiter owns
#                          eighteen mainnet programs and labelling every row
#                          "Jupiter" is accurate and useless — the aggregator,
#                          the perps engine and the lend vaults are different
#                          things and a reader needs to tell them apart.
#
# `category` is the entity's own, and it beats the rule-based classifier
# outright (categorize.ts) — somebody looked, which no needle match can claim.
# Values are freeform; mapCategory() folds them onto the Category enum and
# ignores what it does not recognise, so a typo falls through to the rules
# rather than mislabelling every program the entity owns.
#
# Entity grouping, categories and display names are ours. Names drop the
# trailing " Program" that public listings tend to append — the UI already says
# it is a program. Behavioural coinages ("Arbitrage Bot (2A6m4)") are
# deliberately absent: those are read off transaction patterns rather than
# code, they are invented labels rather than anything a project calls itself,
# and the radar's clone band already carries that signal.
#
# seed-landmarks.ts consumes this file: it names existing rows and ingests the
# ones that have no row yet. Addresses were verified against chain (owner +
# executable) before being listed; landmarks.mainnet.txt is the wider ingestion
# target list, which carries no names at all.
