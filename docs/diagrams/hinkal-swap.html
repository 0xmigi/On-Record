<title>a swap, and the same swap through hinkal</title>
<style>
  :root {
    --paper: #fcfcfa;
    --ink: #1c1c1a;
    --muted: #9c9c96;
    --hair: #d8d8d2;
    --faint: #c3c3bd;
    --hand: "Bradley Hand", "Chalkboard SE", "Segoe Print", "Comic Sans MS", cursive;
    --cycle: 8s;
  }

  /* One fixed visual world — this page is a capture surface for a GIF, so it
     must not shift with the viewer's OS theme mid-recording. */
  html { background: #eceae4; color-scheme: light; }

  body {
    margin: 0; min-height: 100vh;
    display: grid; place-content: center; gap: 18px;
    padding: 32px 16px;
    font-family: var(--hand); color: var(--ink);
  }

  .defs { position: absolute; width: 0; height: 0; overflow: hidden; }

  .frame {
    margin: 0; width: min(780px, 92vw);
    background: var(--paper);
    border: 1px solid var(--hair); border-radius: 14px;
    padding: 26px 30px 30px;
    box-shadow: 0 1px 2px rgb(0 0 0 / 4%);
  }

  .row + .row { margin-top: 6px; padding-top: 18px; border-top: 1px solid var(--hair); }
  .row-label { font-size: 19px; letter-spacing: 0.2px; }
  .scene { display: block; width: 100%; height: auto; overflow: visible; }

  .stroke { fill: none; stroke: var(--ink); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .thin   { stroke-width: 1.2; }
  .ghost  { stroke: var(--faint); stroke-dasharray: 4 6; }
  .pale   { stroke: var(--faint); }
  text    { font-family: var(--hand); fill: var(--ink); }
  .cap    { font-size: 15px; fill: var(--muted); }
  .name   { font-size: 15px; }
  .coin-art circle { fill: none; stroke: var(--ink); stroke-width: 1.1; }
  .chip   { fill: none; stroke: var(--faint); stroke-width: 1.2; }

  /* Every line, both boxes and all the labels are on screen from frame one.
     Only the coins move. */

  /* --- row 1: alice -> dex -> alice --- */
  #p-out { animation: pOut var(--cycle) linear infinite; }
  @keyframes pOut {
    0%, 3%    { transform: translateX(0);     opacity: 0 }
    6%        { transform: translateX(0);     opacity: 1 }
    20%       { transform: translateX(362px); opacity: 1 }
    24%, 100% { transform: translateX(362px); opacity: 0 }
  }
  #p-back { animation: pBack var(--cycle) linear infinite; }
  @keyframes pBack {
    0%, 22%   { transform: translateX(0);      opacity: 0 }
    25%       { transform: translateX(0);      opacity: 1 }
    39%, 93%  { transform: translateX(-336px); opacity: 1 }
    97%, 100% { transform: translateX(-336px); opacity: 0 }
  }

  /* --- row 2: alice -> pool  (stops).  a different coin: pool -> dex -> pool --- */
  #h-in { animation: hIn var(--cycle) linear infinite; }
  @keyframes hIn {
    0%, 3%    { transform: translateX(0);     opacity: 0 }
    6%        { transform: translateX(0);     opacity: 1 }
    20%       { transform: translateX(118px); opacity: 1 }
    30%, 100% { transform: translateX(118px); opacity: 0 }
  }
  #h-out { animation: hOut var(--cycle) linear infinite; }
  @keyframes hOut {
    0%, 33%   { transform: translateX(0);     opacity: 0 }
    37%       { transform: translateX(0);     opacity: 1 }
    54%       { transform: translateX(146px); opacity: 1 }
    58%, 100% { transform: translateX(146px); opacity: 0 }
  }
  #h-back { animation: hBack var(--cycle) linear infinite; }
  @keyframes hBack {
    0%, 56%   { transform: translateX(0);      opacity: 0 }
    60%       { transform: translateX(0);      opacity: 1 }
    78%, 93%  { transform: translateX(-132px); opacity: 1 }
    97%, 100% { transform: translateX(-132px); opacity: 0 }
  }

  /* the question lands while the anonymous coin is out in the open */
  .verdict { opacity: 0; animation: verdictIn var(--cycle) linear infinite; }
  @keyframes verdictIn { 0%, 40% { opacity: 0 } 46%, 93% { opacity: 1 } 100% { opacity: 0 } }

  .controls { display: flex; justify-content: center; }
  button {
    font-family: var(--hand); font-size: 15px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--hair);
    border-radius: 8px; padding: 7px 16px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .hint { text-align: center; font-size: 13px; color: #7d7d78; font-family: system-ui, sans-serif; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; }
    #p-out { opacity: 0 }
    #p-back { opacity: 1; transform: translateX(-336px) }
    #h-in { opacity: 0 }
    #h-out { opacity: 1; transform: translateX(73px) }
    #h-back { opacity: 0 }
    .verdict { opacity: 1 }
  }
</style>
